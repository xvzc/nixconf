name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ledger
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger_dev_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ledger -d ledger"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ledger:ledger_dev_only@127.0.0.1:5432/ledger?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test-unit
      - run: make check-migrations
      - run: make migrate
      - run: make test
      - run: make build
